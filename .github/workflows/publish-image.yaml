name: Publish Container Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: app
        run: node --input-type=module -e "import semver from 'semver'; const tag = process.env.GITHUB_REF_NAME; if (!tag.startsWith('v') || semver.valid(tag.slice(1)) !== tag.slice(1)) process.exit(1);"
      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
      - name: Smoke test container
        run: |
          trap 'docker compose -p release-ci -f compose.yaml -f compose.build.yaml logs; docker compose -p release-ci -f compose.yaml -f compose.build.yaml down --volumes' EXIT
          docker compose -p release-ci -f compose.yaml -f compose.build.yaml up --build --detach --wait --wait-timeout 120
          curl --fail http://127.0.0.1:6972/api/health

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max